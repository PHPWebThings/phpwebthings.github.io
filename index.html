<style>
  :root{
    --bg-0:#0a0818; --bg-1:#161232; --bg-2:#211c47;
    --green:#4ade80; --ink:#f5f9ff; --cyan:#8fd8ff;
    --panel-edge:rgba(143,216,255,.18);
    --panel-glow:rgba(74,222,128,.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100dvh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:clamp(1.5rem,4vw,2.75rem);
    padding:clamp(1.25rem,4vw,3rem);
    background:
      radial-gradient(1200px 700px at 78% 14%, rgba(61,48,128,.55), transparent 60%),
      radial-gradient(900px 600px at 12% 92%, rgba(34,197,94,.10), transparent 55%),
      linear-gradient(150deg, var(--bg-2) 0%, var(--bg-1) 48%, var(--bg-0) 100%);
    color:var(--ink);
    font-family:"Courier New",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:min(1080px,100%);
    max-height:60vh;
    aspect-ratio:16/9;
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--panel-edge);
    box-shadow:
      0 0 0 1px rgba(10,8,24,.6),
      0 30px 80px -30px rgba(0,0,0,.75),
      0 0 90px -20px var(--panel-glow);
    background:var(--bg-0);
    position:relative;
  }
  .hero-svg{display:block; width:100%; height:100%;}
  .screen::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.05), transparent 18%, transparent 82%, rgba(0,0,0,.12));
  }
  .status{text-align:center;}
  .headline{
    margin:0;
    font-size:clamp(1.05rem,1.1rem + 2.4vw,2.25rem);
    font-weight:700; letter-spacing:.34em; text-transform:uppercase;
    line-height:1.1; padding-left:.34em;
  }
  .headline .v{color:var(--green);}
  .headline .c{color:var(--ink);}
  .cursor{
    display:inline-block; width:.62em; height:1.02em;
    margin-left:.12em; transform:translateY(.14em);
    background:var(--green); animation:blink 1.1s steps(1,end) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  :focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:4px;}
  @media (max-width:560px){
    .headline{letter-spacing:.24em;padding-left:.24em;}
  }
  @media (prefers-reduced-motion:reduce){
    .cursor{animation:none;}
  }
</style>
